<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment status – Launchline Studio</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body style="margin:0;font-family:Inter,system-ui,sans-serif;color:#111827;background:#F3F4F6">
<main style="max-width:560px;margin:0 auto;padding:80px 20px">
<div style="background:#fff;border-radius:18px;padding:32px;display:flex;flex-direction:column;gap:14px;box-shadow:0 12px 40px rgba(17,24,39,.08)">
<h1 id="h" style="font-family:'Space Grotesk',sans-serif;font-size:32px;margin:0">Checking your payment…</h1>
<p id="p" style="margin:0;font-size:17px;line-height:1.6;color:#4B5563"></p>
<p id="code" style="margin:0;font-size:14px;color:#4B5563"></p>
<a href="index.html" style="align-self:flex-start;background:#111827;color:#fff;text-decoration:none;padding:14px 22px;border-radius:10px;font-weight:600">Back to Launchline Studio</a>
</div>
</main>
<script>
var sp=new URLSearchParams(location.search), st=sp.get('status'), sid=sp.get('sid'), prod=sp.get('product');
var h=document.getElementById('h'), p=document.getElementById('p');
if(sid) document.getElementById('code').textContent='Payment code: '+sid;
if(st==='ok'){ h.textContent='Payment received. Thank you!'; p.textContent='We have confirmed your payment with Sifalo Pay. We will email you within 24 hours with the next steps for your order. Questions: kcipay59@gmail.com'; }
else if(st==='pending'){ h.textContent='Payment is still processing'; p.textContent='Your payment has not completed yet. If you approved it on your phone, wait a minute and refresh this page. If money left your account and this does not change, email kcipay59@gmail.com with the payment code below.'; }
else { h.textContent='Payment not completed'; p.innerHTML=''; p.appendChild(document.createTextNode('The payment did not go through, so nothing was charged. ')); var a=document.createElement('a'); a.href='pay.html?product='+encodeURIComponent(prod||''); a.textContent='Try again'; p.appendChild(a); p.appendChild(document.createTextNode(' or email kcipay59@gmail.com.')); }
</script>
</body>
</html>
